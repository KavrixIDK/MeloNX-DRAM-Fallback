name: Compilar MeloNX IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compilar sin firmar
        run: |
          xcodebuild \
            -project src/MeloNX/MeloNX.xcodeproj \
            -scheme MeloNX \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Empaquetar como .ipa
        run: |
          mkdir Payload
          cp -r "build/Build/Products/Release-iphoneos/MeloNX.app" Payload/
          zip -r MeloNX.ipa Payload

      - name: Subir el .ipa
        uses: actions/upload-artifact@v4
        with:
          name: MeloNX-ipa
          path: MeloNX.ipa
