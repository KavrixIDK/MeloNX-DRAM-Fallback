name: Compile
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: xcode-27
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compile (sin firmar)
        run: |
          set -o pipefail
          xcodebuild \
            -project src/MeloNX/MeloNX.xcodeproj \
            -scheme MeloNX \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Firmar ad-hoc con los entitlements (paso aparte)
        run: |
          codesign --force --deep --sign - \
            --entitlements src/MeloNX/MeloNX/MeloNX.entitlements \
            "build/Build/Products/Release-iphoneos/MeloNX.app"

      - name: Package
        run: |
          mkdir Payload
          cp -r "build/Build/Products/Release-iphoneos/MeloNX.app" Payload/
          zip -r MeloNX.ipa Payload

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: MeloNX-ipa
          path: MeloNX.ipa

      - name: Subir log de compilación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
